<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Brave Mover Duo · Immersive</title>
<style>
:root{--bg:#050b14;--panel:rgba(7,18,32,.76);--line:rgba(120,205,255,.28);--text:#f4fbff;--muted:#9db6c9;--cyan:#63ddff;--violet:#a986ff;--lime:#c4ff71;--warn:#ffd36a;--bad:#ff7184}*{box-sizing:border-box}html,body{margin:0;background:#050b14;color:var(--text);font-family:Inter,system-ui,"Microsoft YaHei",sans-serif;min-height:100%}body{overflow-x:hidden}.app{width:100%;padding:10px 12px 14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.brand h1{margin:0;font-size:18px;letter-spacing:.04em}.brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}.stage{position:relative;width:100%;aspect-ratio:16/9;background:radial-gradient(circle at 50% 45%,#13233d 0,#08111f 48%,#02070c 100%);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:inset 0 0 80px rgba(46,155,255,.08)}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.34),transparent 18%,transparent 75%,rgba(0,0,0,.46));pointer-events:none}.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,transparent 0 5px,rgba(110,210,255,.018) 6px)}.guide{position:absolute;top:13%;bottom:13%;width:31%;border:2px dashed rgba(99,221,255,.34);border-radius:42% 42% 18% 18%;pointer-events:none;transition:.2s}.guide.a{left:11%}.guide.b{right:11%;border-color:rgba(169,134,255,.34)}.guide.ok{border-style:solid;box-shadow:0 0 30px rgba(99,221,255,.15) inset,0 0 24px rgba(99,221,255,.12)}.guide.b.ok{box-shadow:0 0 30px rgba(169,134,255,.14) inset,0 0 24px rgba(169,134,255,.12)}.guideLabel{position:absolute;top:-33px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(5,15,27,.72);border:1px solid var(--line);font-size:12px;white-space:nowrap}.floor{position:absolute;left:7%;right:7%;bottom:9%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent);opacity:.72;pointer-events:none}.hud{position:absolute;inset:0;padding:16px;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}.hudTop{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}.playerCard,.teamCard,.fairyCard{background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px}.playerCard{padding:10px 13px;min-width:120px;max-width:190px}.playerCard.right{justify-self:end;text-align:right}.tag{font-size:11px;color:#cfe9f8}.big{font-size:34px;font-weight:900;line-height:1}.mini{font-size:11px;color:var(--muted);margin-top:5px}.teamCard{text-align:center;padding:9px 20px;min-width:260px}.mode{font-size:12px;color:#cfe9f8}.score{font-size:38px;font-weight:900;color:var(--lime);line-height:1.05}.combo{font-size:11px;color:var(--muted);margin-top:3px}.feedback{position:absolute;left:50%;top:23%;transform:translate(-50%,-50%);padding:12px 20px;border-radius:18px;background:rgba(6,18,31,.78);border:1px solid var(--line);font-weight:850;font-size:clamp(18px,2vw,32px);text-align:center;min-width:min(520px,70%);text-shadow:0 0 18px rgba(99,221,255,.32);transition:.2s}.feedback.good{color:var(--lime);border-color:rgba(196,255,113,.38)}.feedback.warn{color:var(--warn)}.fairyWrap{display:flex;justify-content:center}.fairyCard{pointer-events:none;display:flex;align-items:center;gap:11px;padding:9px 13px;max-width:min(760px,88%)}.orb{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 8%,#6deaff 18%,#6e5dff 55%,#17255a 75%);box-shadow:0 0 26px rgba(99,221,255,.55)}.fairyText{font-size:13px;line-height:1.45;color:#d8eef8}.dock{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:9px}.dock button{font:inherit;color:white;background:#0c1c2f;border:1px solid #29435e;border-radius:12px;padding:10px 14px;cursor:pointer}.dock button.primary{background:linear-gradient(135deg,#147493,#6040a4);border-color:#6bc9f5;font-weight:800}.dock button.active{box-shadow:inset 0 0 0 1px var(--cyan);border-color:var(--cyan)}.statusline{text-align:center;margin-top:8px;color:var(--muted);font-size:12px}.legend{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:#7893a7}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--bad)}.dot.on{background:var(--lime)}@media(max-width:900px){.app{padding:6px}.brand p{display:none}.stage{border-radius:14px}.teamCard{min-width:170px;padding:7px 12px}.score{font-size:28px}.playerCard{padding:8px 9px}.big{font-size:28px}.guide{top:16%;bottom:16%;width:34%}.guide.a{left:7%}.guide.b{right:7%}.feedback{top:26%;min-width:72%;font-size:18px}.fairyCard{max-width:95%}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand"><h1>BRAVE MOVER · DUO ARENA</h1><p>沉浸式双人运动互动 · 请确保两位勇士从头到脚完整进入画面</p></div></div>
  <section class="stage">
    <video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><div class="veil"></div><div class="scan"></div>
    <div id="guideA" class="guide a"><div id="guideALabel" class="guideLabel">勇士 A · 请站入区域</div></div>
    <div id="guideB" class="guide b"><div id="guideBLabel" class="guideLabel">勇士 B · 请站入区域</div></div>
    <div class="floor"></div>
    <div class="hud">
      <div class="hudTop">
        <div class="playerCard"><div class="tag">勇士 A</div><div id="ha" class="big">0</div><div id="sa" class="mini">等待识别</div></div>
        <div class="teamCard"><div id="modeTitle" class="mode">同步深蹲</div><div id="score" class="score">0</div><div id="combo" class="combo">TEAM SCORE</div></div>
        <div class="playerCard right"><div class="tag">勇士 B</div><div id="hb" class="big">0</div><div id="sb" class="mini">等待识别</div></div>
      </div>
      <div id="feedback" class="feedback warn">点击下方“开启摄像头”，然后两人分别站进左右区域</div>
      <div class="fairyWrap"><div class="fairyCard"><div class="orb"></div><div id="fairy" class="fairyText">曜灵：“站稳一点，让我先完整识别你们两个。”</div></div></div>
    </div>
  </section>
  <div class="dock">
    <button id="start" class="primary">开启摄像头并识别</button>
    <button class="modeBtn active" data-id="squat">深蹲</button>
    <button class="modeBtn" data-id="punch">拳击</button>
    <button class="modeBtn" data-id="knee">高抬腿</button>
    <button id="reset">重置</button><button id="voice">语音：开</button>
  </div>
  <div id="status" class="statusline">尚未启动</div>
  <div class="legend"><span><i id="dotA" class="dot"></i>勇士A识别</span><span><i id="dotB" class="dot"></i>勇士B识别</span><span>建议距离摄像头 2.5–4 m</span><span>头、手、脚全部入镜</span></div>
</div>
<script type="module">
import {FilesetResolver,PoseLandmarker} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0/+esm';
const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d');
const MODES={squat:{name:'同步深蹲',rule:'两人在1.2秒内完成深蹲才获得同步加分'},punch:{name:'交替拳击',rule:'A→B→A→B交替出拳形成Combo'},knee:{name:'同步高抬腿',rule:'两人在1.2秒内完成高抬腿获得同步加分'}};
let mode='squat',landmarker=null,stream=null,running=false,raf=0,lastVideo=-1,voiceOn=true,team=0,combo=0,lastTeam=[0,0],expected=0;
const P=[{count:0,phase:'ready',last:0},{count:0,phase:'ready',last:0}];
const CON=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[27,29],[29,31],[24,26],[26,28],[28,30],[30,32]];
function angle(a,b,c){const u=[a.x-b.x,a.y-b.y],v=[c.x-b.x,c.y-b.y],m=Math.hypot(...u)*Math.hypot(...v);if(!m)return 0;return Math.acos(Math.max(-1,Math.min(1,(u[0]*v[0]+u[1]*v[1])/m)))*180/Math.PI}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function hip(l){return{x:(l[23].x+l[24].x)/2,y:(l[23].y+l[24].y)/2}}
function speak(t){$('fairy').textContent='曜灵：“'+t+'”';if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=1.05;u.pitch=1.05;speechSynthesis.speak(u)}
function setFeedback(t,type='warn'){$('feedback').textContent=t;$('feedback').className='feedback '+type}
function reset(){P.forEach(x=>Object.assign(x,{count:0,phase:'ready',last:0}));team=0;combo=0;lastTeam=[0,0];expected=0;updateUI([]);setFeedback('准备重新开始','warn')}
function setMode(id){mode=id;document.querySelectorAll('.modeBtn').forEach(b=>b.classList.toggle('active',b.dataset.id===id));$('modeTitle').textContent=MODES[id].name;reset();speak('已切换到'+MODES[id].name+'。'+MODES[id].rule)}
function event(i,now,label){P[i].count++;P[i].last=now;if(mode==='punch'){if(i===expected){team+=100;combo++;expected=1-i;setFeedback('接力成功！ COMBO × '+combo,'good');if(combo===4||combo===8)speak('接力很顺，继续保持！')}else{combo=0;expected=1-i;setFeedback('顺序错了，请等待队友','warn')}}else{lastTeam[i]=now;const o=1-i;if(Math.abs(lastTeam[i]-lastTeam[o])<1200){team+=100+Math.min(combo,10)*10;combo++;lastTeam=[0,0];setFeedback('同步成功！ COMBO × '+combo,'good');if(combo===3||combo===6)speak('同步成功，团队连击'+combo+'！')}else setFeedback('动作完成，等待队友','warn')}}
function detect(i,l,now){const s=P[i];let text='识别中',q=.25;if(mode==='squat'){const k=(angle(l[23],l[25],l[27])+angle(l[24],l[26],l[28]))/2;q=Math.max(0,Math.min(1,(170-k)/80));if(k<105&&s.phase!=='down'){s.phase='down';text='下蹲到位'}else if(k>155&&s.phase==='down'&&now-s.last>500){s.phase='up';event(i,now,'深蹲');text='完成一次'}else text=k<130?'保持下蹲':'准备下蹲'}else if(mode==='punch'){const sh=Math.max(.08,dist(l[11],l[12]));const le=Math.abs(l[15].x-l[11].x)>sh*.95&&Math.abs(l[15].y-l[11].y)<sh*.72;const re=Math.abs(l[16].x-l[12].x)>sh*.95&&Math.abs(l[16].y-l[12].y)<sh*.72;const ex=le||re;q=ex?1:.25;if(ex&&s.phase!=='punch'&&now-s.last>300){s.phase='punch';event(i,now,'出拳');text=le?'左拳':'右拳'}else if(!ex){s.phase='ready';text='准备出拳'}}else{const hy=(l[23].y+l[24].y)/2,up=l[25].y<hy+.10||l[26].y<hy+.10;q=up?1:.3;if(up&&s.phase!=='up'){s.phase='up';text='抬膝'}else if(!up&&s.phase==='up'&&now-s.last>300){s.phase='down';event(i,now,'高抬腿');text='完成一次'}else text=up?'抬高':'继续'}return{text,q}}
function fullBody(l){const ids=[0,11,12,15,16,23,24,27,28,31,32];return ids.every(k=>(l[k]?.visibility??1)>.42)&&Math.max(l[31].y,l[32].y)<.98&&l[0].y>.01}
function placement(l,i){const h=hip(l),full=fullBody(l);let msg=full?'完整入镜':'请确保头和脚都在画面内';if(h.y>.68)msg='请向后退一点';if(h.y<.34)msg='请靠近一点';if(i===0&&h.x<.46)msg='请向画面左侧移动';if(i===1&&h.x>.54)msg='请向画面右侧移动';return{full,msg}}
function draw(l,color){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=3.4;ctx.globalAlpha=.94;for(const[a,b]of CON){if(!l[a]||!l[b])continue;ctx.beginPath();ctx.moveTo(l[a].x*canvas.width,l[a].y*canvas.height);ctx.lineTo(l[b].x*canvas.width,l[b].y*canvas.height);ctx.stroke()}for(const p of l){if((p.visibility??1)<.35)continue;ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,4.2,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function updateUI(poses){for(let i=0;i<2;i++){const on=!!poses[i],key=i?'b':'a';$('h'+key).textContent=P[i].count;$('dot'+(i?'B':'A')).classList.toggle('on',on)}$('score').textContent=team;$('combo').textContent=combo?'COMBO × '+combo:'TEAM SCORE'}
async function start(){try{$('status').textContent='正在申请摄像头权限…';stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play();canvas.width=video.videoWidth||1920;canvas.height=video.videoHeight||1080;$('status').textContent='正在加载双人姿态模型…';const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0/wasm');landmarker=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:2,minPoseDetectionConfidence:.55,minPosePresenceConfidence:.55,minTrackingConfidence:.55});running=true;$('status').textContent='识别运行中 · 请两人完整入镜';speak('识别启动。两位勇士分别站进左右区域，并确保头和脚都在画面里。');cancelAnimationFrame(raf);loop()}catch(e){console.error(e);$('status').textContent='启动失败：'+(e.name==='NotAllowedError'?'请允许摄像头权限':e.message);setFeedback('摄像头启动失败，请检查浏览器权限','warn')}}
function loop(){if(!running)return;const now=performance.now();if(video.readyState>=2&&video.currentTime!==lastVideo){lastVideo=video.currentTime;const r=landmarker.detectForVideo(video,now);ctx.clearRect(0,0,canvas.width,canvas.height);const poses=(r.landmarks||[]).slice().sort((a,b)=>hip(b).x-hip(a).x).slice(0,2);poses.forEach((l,i)=>{draw(l,i?'#a986ff':'#63ddff');const place=placement(l,i),g=$(i?'guideB':'guideA'),gl=$(i?'guideBLabel':'guideALabel');g.classList.toggle('ok',place.full);gl.textContent='勇士 '+(i?'B':'A')+' · '+place.msg;if(place.full){const d=detect(i,l,now);$(i?'sb':'sa').textContent=d.text}else $(i?'sb':'sa').textContent=place.msg});if(!poses[0]){$('guideA').classList.remove('ok');$('guideALabel').textContent='勇士 A · 请站入区域';$('sa').textContent='等待识别'}if(!poses[1]){$('guideB').classList.remove('ok');$('guideBLabel').textContent='勇士 B · 请站入区域';$('sb').textContent='等待识别'}updateUI(poses);if(poses.length<2)setFeedback('需要两名勇士同时进入画面','warn');else if(poses.every(fullBody)&&combo===0)setFeedback('两位勇士已就位 · '+MODES[mode].rule,'good')}raf=requestAnimationFrame(loop)}
$('start').onclick=start;$('reset').onclick=reset;$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').textContent='语音：'+(voiceOn?'开':'关');if(!voiceOn)speechSynthesis?.cancel()};document.querySelectorAll('.modeBtn').forEach(b=>b.onclick=()=>setMode(b.dataset.id));
</script>
</body>
</html>
