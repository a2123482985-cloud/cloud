<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Brave Mover Duo</title>
<style>
:root{--bg:#07111f;--panel:#0f2034;--line:#284660;--text:#eef7ff;--muted:#91a9bf;--cyan:#57d9ff;--violet:#a77dff;--lime:#b9ff6b;--warn:#ffd166}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07111f,#0b1828);color:var(--text);font-family:Inter,system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1300px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.top h1{font-size:20px;margin:0}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}.btns{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:#10233a;color:white;padding:10px 14px;border-radius:12px;font:inherit;cursor:pointer}button.primary{background:linear-gradient(135deg,#126b8d,#513a91);font-weight:700}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.75fr);gap:14px;margin-top:14px}@media(max-width:900px){.grid{grid-template-columns:1fr}}.stage{position:relative;aspect-ratio:16/9;background:#02070d;border:1px solid var(--line);border-radius:18px;overflow:hidden}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.hud{position:absolute;inset:0;pointer-events:none;padding:14px;display:flex;flex-direction:column;justify-content:space-between}.row{display:flex;justify-content:space-between;gap:10px}.pill{background:rgba(5,15,27,.82);border:1px solid rgba(120,190,230,.3);border-radius:14px;padding:9px 12px}.pill span{font-size:11px;color:#cde5f4}.pill b{display:block;font-size:25px}.center{text-align:center;min-width:230px}.score{font-size:31px;color:var(--lime);font-weight:850}.prompt{align-self:center;max-width:78%;text-align:center;background:rgba(5,15,27,.84);border:1px solid var(--line);border-radius:13px;padding:10px 14px;font-size:13px}.panel{background:rgba(15,32,52,.96);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}.card{background:#0b1929;border:1px solid #1e3955;border-radius:13px;padding:12px}.card h3{margin:0 0 8px;font-size:14px}.card p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.55}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mode.active{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan)}.players{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pbox{background:#0b1929;border:1px solid #1e3955;border-radius:13px;padding:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff667a;margin-right:6px}.dot.on{background:var(--lime)}.metric{font-size:24px;font-weight:800;margin-top:5px}.sub{font-size:11px;color:var(--muted)}.bar{height:6px;border-radius:99px;background:#173049;overflow:hidden;margin-top:7px}.bar i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet))}.fairy{display:flex;gap:10px;align-items:flex-start}.orb{width:42px;height:42px;border-radius:50%;flex:0 0 42px;background:radial-gradient(circle at 35% 35%,#fff 0 8%,#6deaff 19%,#6d5dff 55%,#15245a 74%);box-shadow:0 0 25px rgba(87,217,255,.55)}.status{font-size:12px;color:var(--warn);line-height:1.5}.log{font-size:11px;color:var(--muted);max-height:90px;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>BRAVE MOVER · 双人互动原型</h1><p>免费版：双人摄像头识别 + 深蹲 / 交替拳击 / 高抬腿 + 即时反馈</p></div>
    <div class="btns"><button id="start" class="primary">开启摄像头并识别</button><button id="reset">重置</button><button id="voice">语音：开</button></div>
  </div>
  <div class="grid">
    <section class="stage">
      <video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas>
      <div class="hud">
        <div class="row"><div class="pill"><span>勇士 A</span><b id="ha">0</b></div><div class="pill center"><span id="modeTitle">同步深蹲</span><div class="score" id="score">0</div><span id="combo">TEAM SCORE</span></div><div class="pill" style="text-align:right"><span>勇士 B</span><b id="hb">0</b></div></div>
        <div id="prompt" class="prompt">点击“开启摄像头并识别”，然后两人并排、全身进入画面。</div>
      </div>
    </section>
    <aside class="panel">
      <div class="card fairy"><div class="orb"></div><div><h3>曜灵 · AI 协作精灵</h3><p id="fairy">“两位勇士一起完成动作，我会在你们真正协作时给团队加分。”</p></div></div>
      <div class="modes" id="modes"></div>
      <div class="players">
        <div class="pbox"><b><span id="d0" class="dot"></span>勇士 A</b><div id="c0" class="metric">0</div><div id="s0" class="sub">等待识别</div><div class="bar"><i id="b0"></i></div></div>
        <div class="pbox"><b><span id="d1" class="dot"></span>勇士 B</b><div id="c1" class="metric">0</div><div id="s1" class="sub">等待识别</div><div class="bar"><i id="b1"></i></div></div>
      </div>
      <div class="card"><h3>本关协作规则</h3><p id="rule"></p></div>
      <div class="card"><h3>运行状态</h3><div id="status" class="status">尚未启动</div><div id="log" class="log"></div></div>
    </aside>
  </div>
</div>
<script type="module">
import {FilesetResolver,PoseLandmarker} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0/+esm';
const $=id=>document.getElementById(id), video=$('video'), canvas=$('canvas'), ctx=canvas.getContext('2d');
const MODES=[
{id:'squat',name:'同步深蹲',rule:'两人在 1.2 秒内都完成一次深蹲，团队才获得同步加分。'},
{id:'punch',name:'交替拳击',rule:'必须 A→B→A→B 交替出拳，正确接力形成 Combo。'},
{id:'knee',name:'同步高抬腿',rule:'两人在 1.2 秒内都完成一次高抬腿，团队获得同步加分。'}];
let mode=MODES[0],landmarker=null,stream=null,running=false,raf=0,lastVideo=-1,voiceOn=true,team=0,combo=0,lastTeam=[0,0],expected=0;
const P=[{count:0,phase:'ready',last:0},{count:0,phase:'ready',last:0}];
const CON=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function angle(a,b,c){const u=[a.x-b.x,a.y-b.y],v=[c.x-b.x,c.y-b.y],m=Math.hypot(...u)*Math.hypot(...v);if(!m)return 0;return Math.acos(Math.max(-1,Math.min(1,(u[0]*v[0]+u[1]*v[1])/m)))*180/Math.PI}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function hip(l){return{x:(l[23].x+l[24].x)/2,y:(l[23].y+l[24].y)/2}}
function speak(t){$('fairy').textContent='“'+t+'”';if(!voiceOn||!speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=1.06;u.pitch=1.05;speechSynthesis.speak(u)}
function log(t){$('log').textContent=(t+'\n'+$('log').textContent).slice(0,900)}
function setMode(id){mode=MODES.find(x=>x.id===id)||MODES[0];document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.id===id));$('modeTitle').textContent=mode.name;$('rule').textContent=mode.rule;reset(false);speak('已切换到'+mode.name)}
function renderModes(){MODES.forEach(m=>{const b=document.createElement('button');b.className='mode';b.dataset.id=m.id;b.textContent=m.name.replace('同步','');b.onclick=()=>setMode(m.id);$('modes').appendChild(b)});setMode('squat')}
function reset(clear=true){P.forEach(x=>Object.assign(x,{count:0,phase:'ready',last:0}));team=0;combo=0;lastTeam=[0,0];expected=0;if(clear)$('log').textContent='';ui([])}
function event(i,now,label){P[i].count++;P[i].last=now;log(`勇士${i?'B':'A'}：${label}`);if(mode.id==='punch'){if(i===expected){team+=100;combo++;expected=1-i;if(combo===4||combo===8)speak('接力很顺，继续保持！')}else{combo=0;expected=1-i}}else{lastTeam[i]=now;const o=1-i;if(Math.abs(lastTeam[i]-lastTeam[o])<1200){team+=100+Math.min(combo,10)*10;combo++;lastTeam=[0,0];if(combo===3||combo===6)speak('同步成功，团队连击'+combo+'！')}}}
function detect(i,l,now){const s=P[i];let text='识别中',q=.2;if(mode.id==='squat'){const k=(angle(l[23],l[25],l[27])+angle(l[24],l[26],l[28]))/2;q=Math.max(0,Math.min(1,(170-k)/80));if(k<105&&s.phase!=='down'){s.phase='down';text='下蹲到位'}else if(k>155&&s.phase==='down'&&now-s.last>500){s.phase='up';event(i,now,'深蹲完成');text='完成一次'}else text=k<130?'保持下蹲':'准备下蹲'}
else if(mode.id==='punch'){const sh=Math.max(.08,dist(l[11],l[12]));const le=Math.abs(l[15].x-l[11].x)>sh*.95&&Math.abs(l[15].y-l[11].y)<sh*.7;const re=Math.abs(l[16].x-l[12].x)>sh*.95&&Math.abs(l[16].y-l[12].y)<sh*.7;const ex=le||re;q=ex?1:.2;if(ex&&s.phase!=='punch'&&now-s.last>300){s.phase='punch';event(i,now,'出拳');text=le?'左拳':'右拳'}else if(!ex){s.phase='ready';text='准备出拳'}}
else if(mode.id==='knee'){const hy=(l[23].y+l[24].y)/2,up=l[25].y<hy+.10||l[26].y<hy+.10;q=up?1:.3;if(up&&s.phase!=='up'){s.phase='up';text='抬膝'}else if(!up&&s.phase==='up'&&now-s.last>300){s.phase='down';event(i,now,'高抬腿完成');text='完成一次'}else text=up?'抬高':'继续'}return{text,q}}
function draw(l,color){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=3;for(const[a,b]of CON){ctx.beginPath();ctx.moveTo(l[a].x*canvas.width,l[a].y*canvas.height);ctx.lineTo(l[b].x*canvas.width,l[b].y*canvas.height);ctx.stroke()}for(const p of l){ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,3.5,0,Math.PI*2);ctx.fill()}}
function ui(poses){for(let i=0;i<2;i++){const on=!!poses[i];$('d'+i).classList.toggle('on',on);$('c'+i).textContent=P[i].count;$('h'+(i?'b':'a')).textContent=P[i].count}$('score').textContent=team;$('combo').textContent=combo?'COMBO × '+combo:'TEAM SCORE'}
async function start(){try{$('status').textContent='正在申请摄像头权限…';stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();canvas.width=video.videoWidth||1280;canvas.height=video.videoHeight||720;$('status').textContent='正在加载 AI 姿态模型…';const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0/wasm');landmarker=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:2,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5});running=true;$('status').textContent='识别运行中：请两人全身入镜';speak('识别启动。两位勇士请并排站好。');cancelAnimationFrame(raf);loop()}catch(e){console.error(e);$('status').textContent='启动失败：'+(e.name==='NotAllowedError'?'请在浏览器地址栏允许摄像头权限':e.message)}}
async function loop(){if(!running){return}const now=performance.now();if(video.readyState>=2&&video.currentTime!==lastVideo){lastVideo=video.currentTime;const r=landmarker.detectForVideo(video,now);ctx.clearRect(0,0,canvas.width,canvas.height);const poses=(r.landmarks||[]).slice().sort((a,b)=>hip(b).x-hip(a).x).slice(0,2);poses.forEach((l,i)=>{draw(l,i?'#a77dff':'#57d9ff');const d=detect(i,l,now);$('s'+i).textContent=d.text;$('b'+i).style.width=Math.round(d.q*100)+'%'});ui(poses);$('prompt').textContent=poses.length<2?'需要两名勇士同时完整进入画面':mode.rule}raf=requestAnimationFrame(loop)}
$('start').onclick=start;$('reset').onclick=()=>{reset(true);speak('本局已重置。')};$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').textContent='语音：'+(voiceOn?'开':'关');if(!voiceOn)speechSynthesis.cancel()};renderModes();
</script>
</body>
</html>
