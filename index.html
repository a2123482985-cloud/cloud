<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Brave Mover Duo · High Accuracy</title>
<style>
:root{--bg:#050b14;--panel:rgba(7,18,32,.80);--line:rgba(120,205,255,.30);--text:#f4fbff;--muted:#9db6c9;--cyan:#63ddff;--violet:#a986ff;--lime:#c4ff71;--warn:#ffd36a;--bad:#ff7184}
*{box-sizing:border-box}html,body{margin:0;background:#050b14;color:var(--text);font-family:Inter,system-ui,"Microsoft YaHei",sans-serif;min-height:100%}body{overflow-x:hidden}.app{width:100%;padding:10px 12px 14px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.brand h1{margin:0;font-size:18px;letter-spacing:.04em}.brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.stage{position:relative;width:100%;aspect-ratio:16/9;background:radial-gradient(circle at 50% 45%,#13233d 0,#08111f 48%,#02070c 100%);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:inset 0 0 80px rgba(46,155,255,.08)}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 18%,transparent 75%,rgba(0,0,0,.42));pointer-events:none}.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,transparent 0 5px,rgba(110,210,255,.018) 6px)}
.guide{position:absolute;top:12%;bottom:11%;width:31%;border:2px dashed rgba(99,221,255,.35);border-radius:42% 42% 18% 18%;pointer-events:none;transition:.2s}.guide.a{left:11%}.guide.b{right:11%;border-color:rgba(169,134,255,.36)}.guide.ok{border-style:solid;box-shadow:0 0 30px rgba(99,221,255,.17) inset,0 0 24px rgba(99,221,255,.12)}.guide.bad{border-color:rgba(255,113,132,.62)}.guideLabel{position:absolute;top:-33px;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:999px;background:rgba(5,15,27,.78);border:1px solid var(--line);font-size:12px;white-space:nowrap}.floor{position:absolute;left:7%;right:7%;bottom:8%;height:2px;background:linear-gradient(90deg,transparent,var(--cyan),var(--violet),transparent);opacity:.72;pointer-events:none}
.hud{position:absolute;inset:0;padding:16px;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}.hudTop{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:start}.playerCard,.teamCard,.fairyCard,.qualityCard{background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px}.playerCard{padding:10px 13px;min-width:120px;max-width:190px}.playerCard.right{justify-self:end;text-align:right}.tag{font-size:11px;color:#cfe9f8}.big{font-size:34px;font-weight:900;line-height:1}.mini{font-size:11px;color:var(--muted);margin-top:5px}.teamCard{text-align:center;padding:9px 20px;min-width:270px}.mode{font-size:12px;color:#cfe9f8}.score{font-size:38px;font-weight:900;color:var(--lime);line-height:1.05}.combo{font-size:11px;color:var(--muted);margin-top:3px}
.feedback{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);padding:12px 20px;border-radius:18px;background:rgba(6,18,31,.80);border:1px solid var(--line);font-weight:850;font-size:clamp(18px,2vw,32px);text-align:center;min-width:min(560px,74%);text-shadow:0 0 18px rgba(99,221,255,.32);transition:.2s}.feedback.good{color:var(--lime);border-color:rgba(196,255,113,.38)}.feedback.warn{color:var(--warn)}.feedback.bad{color:#ff9aaa;border-color:rgba(255,113,132,.45)}
.fairyWrap{display:flex;justify-content:center}.fairyCard{display:flex;align-items:center;gap:11px;padding:9px 13px;max-width:min(760px,88%)}.orb{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 8%,#6deaff 18%,#6e5dff 55%,#17255a 75%);box-shadow:0 0 26px rgba(99,221,255,.55)}.fairyText{font-size:13px;line-height:1.45;color:#d8eef8}
.dock{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:9px}.dock button{font:inherit;color:white;background:#0c1c2f;border:1px solid #29435e;border-radius:12px;padding:10px 14px;cursor:pointer}.dock button.primary{background:linear-gradient(135deg,#147493,#6040a4);border-color:#6bc9f5;font-weight:800}.dock button.active{box-shadow:inset 0 0 0 1px var(--cyan);border-color:var(--cyan)}.statusline{text-align:center;margin-top:8px;color:var(--muted);font-size:12px}.qualityRow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:7px}.qualityCard{padding:7px 11px;min-width:180px;font-size:11px;color:var(--muted)}.qbar{height:5px;background:#142a40;border-radius:99px;margin-top:5px;overflow:hidden}.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--warn),var(--lime));transition:width .15s}.legend{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:#7893a7}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--bad)}.dot.on{background:var(--lime)}
@media(max-width:900px){.app{padding:6px}.brand p{display:none}.stage{border-radius:14px}.teamCard{min-width:170px;padding:7px 12px}.score{font-size:28px}.playerCard{padding:8px 9px}.big{font-size:28px}.guide{top:16%;bottom:14%;width:34%}.guide.a{left:7%}.guide.b{right:7%}.feedback{top:26%;min-width:72%;font-size:18px}.fairyCard{max-width:95%}.qualityCard{min-width:145px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand"><h1>BRAVE MOVER · DUO ARENA</h1><p>高精度双人识别模式 · Heavy Pose + 时序平滑 + 全身质量检测</p></div></div>
  <section class="stage">
    <video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><div class="veil"></div><div class="scan"></div>
    <div id="guideA" class="guide a"><div id="guideALabel" class="guideLabel">勇士 A · 请站入区域</div></div>
    <div id="guideB" class="guide b"><div id="guideBLabel" class="guideLabel">勇士 B · 请站入区域</div></div>
    <div class="floor"></div>
    <div class="hud">
      <div class="hudTop">
        <div class="playerCard"><div class="tag">勇士 A</div><div id="ha" class="big">0</div><div id="sa" class="mini">等待识别</div></div>
        <div class="teamCard"><div id="modeTitle" class="mode">同步深蹲</div><div id="score" class="score">0</div><div id="combo" class="combo">TEAM SCORE</div></div>
        <div class="playerCard right"><div class="tag">勇士 B</div><div id="hb" class="big">0</div><div id="sb" class="mini">等待识别</div></div>
      </div>
      <div id="feedback" class="feedback warn">点击“开启高精度识别”，然后两人分别站进左右区域</div>
      <div class="fairyWrap"><div class="fairyCard"><div class="orb"></div><div id="fairy" class="fairyText">曜灵：“白色或灰色衣服也可以识别，但请尽量不要和背景颜色太接近。”</div></div></div>
    </div>
  </section>
  <div class="dock">
    <button id="start" class="primary">开启高精度识别</button>
    <button class="modeBtn active" data-id="squat">深蹲</button>
    <button class="modeBtn" data-id="punch">拳击</button>
    <button class="modeBtn" data-id="knee">高抬腿</button>
    <button id="reset">重置</button><button id="voice">语音：开</button>
  </div>
  <div class="qualityRow">
    <div class="qualityCard">勇士 A 识别质量 <b id="qaText">0%</b><div class="qbar"><i id="qa"></i></div></div>
    <div class="qualityCard">勇士 B 识别质量 <b id="qbText">0%</b><div class="qbar"><i id="qb"></i></div></div>
    <div class="qualityCard">环境亮度 <b id="lightText">待检测</b><div class="qbar"><i id="lightBar"></i></div></div>
  </div>
  <div id="status" class="statusline">尚未启动</div>
  <div class="legend"><span><i id="dotA" class="dot"></i>勇士A识别</span><span><i id="dotB" class="dot"></i>勇士B识别</span><span>推荐深色/有颜色背景</span><span>避免白衣 + 白墙 / 灰衣 + 灰墙</span></div>
</div>
<canvas id="lightCanvas" width="48" height="27" hidden></canvas>
<script type="module">
import {FilesetResolver,PoseLandmarker} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0/+esm';
const $=id=>document.getElementById(id),video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d'),lightCanvas=$('lightCanvas'),lctx=lightCanvas.getContext('2d',{willReadFrequently:true});
const MODES={squat:{name:'同步深蹲',rule:'两人在1.2秒内完成深蹲才获得同步加分'},punch:{name:'交替拳击',rule:'A→B→A→B交替出拳形成Combo'},knee:{name:'同步高抬腿',rule:'两人在1.2秒内完成高抬腿获得同步加分'}};
let mode='squat',landmarker=null,stream=null,running=false,raf=0,lastVideo=-1,voiceOn=true,team=0,combo=0,lastTeam=[0,0],expected=0,lastLightCheck=0;
const P=[{count:0,phase:'ready',last:0},{count:0,phase:'ready',last:0}],smooth=[null,null];
const CON=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[27,29],[29,31],[24,26],[26,28],[28,30],[30,32]];
const CORE=[0,11,12,13,14,15,16,23,24,25,26,27,28,31,32];
function angle(a,b,c){const u=[a.x-b.x,a.y-b.y],v=[c.x-b.x,c.y-b.y],m=Math.hypot(...u)*Math.hypot(...v);if(!m)return 0;return Math.acos(Math.max(-1,Math.min(1,(u[0]*v[0]+u[1]*v[1])/m)))*180/Math.PI}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function hip(l){return{x:(l[23].x+l[24].x)/2,y:(l[23].y+l[24].y)/2}}
function visibility(l){return CORE.reduce((s,k)=>s+Math.max(0,Math.min(1,l[k]?.visibility??0)),0)/CORE.length}
function smoothPose(i,l){const prev=smooth[i];if(!prev){smooth[i]=l.map(p=>({...p}));return smooth[i]}const alpha=.70;const out=l.map((p,k)=>{const q=prev[k]||p;return{...p,x:alpha*p.x+(1-alpha)*q.x,y:alpha*p.y+(1-alpha)*q.y,z:alpha*(p.z??0)+(1-alpha)*(q.z??0),visibility:Math.max(p.visibility??0,(q.visibility??0)*.92)}});smooth[i]=out;return out}
function speak(t){$('fairy').textContent='曜灵：“'+t+'”';if(!voiceOn||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=1.05;u.pitch=1.05;speechSynthesis.speak(u)}
function setFeedback(t,type='warn'){$('feedback').textContent=t;$('feedback').className='feedback '+type}
function reset(){P.forEach(x=>Object.assign(x,{count:0,phase:'ready',last:0}));smooth[0]=smooth[1]=null;team=0;combo=0;lastTeam=[0,0];expected=0;updateUI([]);setFeedback('准备重新开始','warn')}
function setMode(id){mode=id;document.querySelectorAll('.modeBtn').forEach(b=>b.classList.toggle('active',b.dataset.id===id));$('modeTitle').textContent=MODES[id].name;reset();speak('已切换到'+MODES[id].name+'。'+MODES[id].rule)}
function event(i,now,label){P[i].count++;P[i].last=now;if(mode==='punch'){if(i===expected){team+=100;combo++;expected=1-i;setFeedback('接力成功！ COMBO × '+combo,'good');if(combo===4||combo===8)speak('接力很顺，继续保持！')}else{combo=0;expected=1-i;setFeedback('顺序错了，请等待队友','warn')}}else{lastTeam[i]=now;const o=1-i;if(Math.abs(lastTeam[i]-lastTeam[o])<1200){team+=100+Math.min(combo,10)*10;combo++;lastTeam=[0,0];setFeedback('同步成功！ COMBO × '+combo,'good');if(combo===3||combo===6)speak('同步成功，团队连击'+combo+'！')}else setFeedback('动作完成，等待队友','warn')}}
function detect(i,l,now){const s=P[i];let text='识别中',q=.25;if(mode==='squat'){const k=(angle(l[23],l[25],l[27])+angle(l[24],l[26],l[28]))/2;q=Math.max(0,Math.min(1,(170-k)/80));if(k<108&&s.phase!=='down'){s.phase='down';text='下蹲到位'}else if(k>154&&s.phase==='down'&&now-s.last>520){s.phase='up';event(i,now,'深蹲');text='完成一次'}else text=k<132?'保持下蹲':'准备下蹲'}else if(mode==='punch'){const sh=Math.max(.08,dist(l[11],l[12]));const le=Math.abs(l[15].x-l[11].x)>sh*.90&&Math.abs(l[15].y-l[11].y)<sh*.78;const re=Math.abs(l[16].x-l[12].x)>sh*.90&&Math.abs(l[16].y-l[12].y)<sh*.78;const ex=le||re;q=ex?1:.25;if(ex&&s.phase!=='punch'&&now-s.last>320){s.phase='punch';event(i,now,'出拳');text=le?'左拳':'右拳'}else if(!ex){s.phase='ready';text='准备出拳'}}else{const hy=(l[23].y+l[24].y)/2,up=l[25].y<hy+.115||l[26].y<hy+.115;q=up?1:.3;if(up&&s.phase!=='up'){s.phase='up';text='抬膝'}else if(!up&&s.phase==='up'&&now-s.last>320){s.phase='down';event(i,now,'高抬腿');text='完成一次'}else text=up?'抬高':'继续'}return{text,q}}
function fullBody(l){const q=visibility(l);const feet=Math.max(l[31]?.y??1,l[32]?.y??1)<.985;const head=(l[0]?.y??0)>.005;const coreInFrame=CORE.every(k=>{const p=l[k];return p&&p.x>-.02&&p.x<1.02&&p.y>-.02&&p.y<1.02});return q>.43&&feet&&head&&coreInFrame}
function quality(l){let q=visibility(l);if(!fullBody(l))q*=.72;const h=hip(l),height=Math.max(.01,Math.max(l[31]?.y??1,l[32]?.y??1)-(l[0]?.y??0));if(height<.47)q*=.78;if(height>.94)q*=.84;if(h.x<.08||h.x>.92)q*=.82;return Math.max(0,Math.min(1,q))}
function placement(l,i){const h=hip(l),full=fullBody(l),q=quality(l);let msg=full?'完整入镜':'请确保头和脚都在画面内';if(full&&q<.58)msg='关键点不稳定，请改善光线/背景对比';if(full&&h.y>.66)msg='请后退一步，让全身更完整';const screenX=1-h.x;if(i===0&&screenX>.49)msg='勇士A请向画面左侧移动';if(i===1&&screenX<.51)msg='勇士B请向画面右侧移动';return{full,q,msg}}
function draw(l,color,q){ctx.save();ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=q>.6?4:3;ctx.globalAlpha=Math.max(.42,q);for(const[a,b]of CON){const va=l[a]?.visibility??0,vb=l[b]?.visibility??0;if(va<.25||vb<.25)continue;ctx.beginPath();ctx.moveTo(l[a].x*canvas.width,l[a].y*canvas.height);ctx.lineTo(l[b].x*canvas.width,l[b].y*canvas.height);ctx.stroke()}for(const k of CORE){const p=l[k];if(!p||(p.visibility??0)<.22)continue;ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,4.2,0,Math.PI*2);ctx.fill()}ctx.restore()}
function updateQuality(i,q){const id=i===0?'a':'b';$(id==='a'?'qa':'qb').style.width=Math.round(q*100)+'%';$(id==='a'?'qaText':'qbText').textContent=Math.round(q*100)+'%'}
function updateUI(poses,places=[]){for(let i=0;i<2;i++){const on=!!poses[i];$(i===0?'dotA':'dotB').classList.toggle('on',on);$(i===0?'ha':'hb').textContent=P[i].count;$(i===0?'sa':'sb').textContent=on?(places[i]?.msg||'识别中'):'未检测到';const g=$(i===0?'guideA':'guideB'),gl=$(i===0?'guideALabel':'guideBLabel');g.classList.toggle('ok',!!places[i]?.full&&places[i]?.q>.55);g.classList.toggle('bad',on&&!places[i]?.full);gl.textContent='勇士 '+(i===0?'A':'B')+' · '+(on?(places[i]?.msg||'识别中'):'请站入区域');updateQuality(i,on?(places[i]?.q||0):0)}$('score').textContent=team;$('combo').textContent=combo?'COMBO × '+combo:'TEAM SCORE'}
function checkLight(now){if(now-lastLightCheck<1000||video.readyState<2)return;lastLightCheck=now;try{lctx.drawImage(video,0,0,48,27);const d=lctx.getImageData(0,0,48,27).data;let sum=0,min=255,max=0;for(let i=0;i<d.length;i+=4){const y=.2126*d[i]+.7152*d[i+1]+.0722*d[i+2];sum+=y;min=Math.min(min,y);max=Math.max(max,y)}const mean=sum/(d.length/4),range=max-min;const score=Math.max(0,Math.min(100,((mean-35)/120)*70+(range/180)*30));$('lightBar').style.width=Math.round(score)+'%';$('lightText').textContent=score>72?'良好':score>48?'一般':'偏弱';if(score<42&&running)setFeedback('环境偏暗，请增加正面光线','warn')}catch{}}
async function start(){try{$('status').textContent='正在申请摄像头权限…';stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1920},height:{ideal:1080},frameRate:{ideal:30,max:30}},audio:false});video.srcObject=stream;await video.play();canvas.width=video.videoWidth||1920;canvas.height=video.videoHeight||1080;$('status').textContent='正在加载 Heavy 高精度姿态模型…';setFeedback('模型加载中…','warn');const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0/wasm');landmarker=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:2,minPoseDetectionConfidence:.35,minPosePresenceConfidence:.35,minTrackingConfidence:.62});running=true;$('status').textContent='高精度识别运行中 · 请保持人物与背景有明显对比';setFeedback('请两位勇士完整站入左右区域','warn');speak('高精度识别启动。白色或灰色衣服时，请尽量使用深色或有颜色的背景。');cancelAnimationFrame(raf);loop()}catch(e){console.error(e);$('status').textContent='启动失败：'+(e.name==='NotAllowedError'?'请允许摄像头权限':e.message);setFeedback('启动失败，请查看下方状态','bad')}}
function loop(){if(!running)return;const now=performance.now();checkLight(now);if(video.readyState>=2&&video.currentTime!==lastVideo){lastVideo=video.currentTime;const r=landmarker.detectForVideo(video,now);ctx.clearRect(0,0,canvas.width,canvas.height);const raw=(r.landmarks||[]).slice().sort((a,b)=>hip(b).x-hip(a).x).slice(0,2);const poses=raw.map((l,i)=>smoothPose(i,l)),places=[];poses.forEach((l,i)=>{const p=placement(l,i);places[i]=p;draw(l,i===0?'#63ddff':'#a986ff',p.q);if(p.full&&p.q>.48){const d=detect(i,l,now);$(i===0?'sa':'sb').textContent=d.text}else if(p.q<.45){P[i].phase='ready'}});updateUI(poses,places);if(poses.length<2)setFeedback('需要两名勇士同时完整进入画面','warn');else if(places.some(x=>!x.full))setFeedback('先调整站位：头、手、脚都要完整入镜','warn');else if(places.some(x=>x.q<.55))setFeedback('识别质量偏低：增加正面光线，并让衣服与背景颜色不同','warn')}raf=requestAnimationFrame(loop)}
$('start').onclick=start;$('reset').onclick=reset;$('voice').onclick=()=>{voiceOn=!voiceOn;$('voice').textContent='语音：'+(voiceOn?'开':'关');if(!voiceOn)speechSynthesis?.cancel()};document.querySelectorAll('.modeBtn').forEach(b=>b.onclick=()=>setMode(b.dataset.id));
</script>
</body>
</html>
